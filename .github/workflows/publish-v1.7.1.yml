name: Publish Puppet Desk 1.9.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.7.1.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify owner licensing server readiness
        run: |
          curl --fail --silent --show-error --max-time 20 -H 'ngrok-skip-browser-warning: 1' -A 'PuppetDesk/ReleaseReadiness' https://mummified-isolating-unsaved.ngrok-free.dev/health > health.json
          python3 - <<'PY'
          import json
          h=json.load(open('health.json'))
          assert h.get('Service') == 'PuppetDeskLicensing' and h.get('Ready') is True, 'Service not ready'
          assert h.get('TermsVersion') == '2026-11-06-2', 'Server update required'
          assert h.get('PublicKeySHA256') == '03c14daf9df4d8b6b5689071b381c23fcc518e7cd6e87bc87d61cf459fe14530', 'Verification key mismatch'
          print('Verified live HTTPS server readiness and public verification key')
          PY
      - name: Download verified build artifact
        env:
          ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-be2c-81f5-80d5-ef8b540d3ff0/raw?se=2026-11-06T23%3A07%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=509fc879-a9a9-4596-b9fe-c72432805046&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-06T18%3A17%3A35Z&ske=2026-11-07T18%3A17%3A35Z&sks=b&skv=2026-02-06&sig=1QdCz6eqUE9RderXsAjPfBtZ%2BvpkBexCyFw9PCpr5a8%3D'
        run: |
          curl --fail --location --retry 2 --retry-delay 2 --max-time 60 --output public.zip "$ARTIFACT_URL"
          echo '1581e95eb561195359fc8da646de824d750df3ef187d9d3c9972c86736ebba64  public.zip' | sha256sum --check
          mkdir assets
          unzip -q public.zip -d assets
          (cd assets && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          from zipfile import ZipFile
          import json
          from pathlib import Path
          assert {p.name for p in Path('assets').iterdir()} == {'Install-Puppet-Desk.exe','PuppetDesk-Windows.zip','SHA256SUMS.txt'}
          with ZipFile('assets/PuppetDesk-Windows.zip') as z:
              info=json.loads(z.read('build-info.json').decode('utf-8-sig'))
              assert set(z.namelist()) == {'Puppet Desk.exe','README.txt','Update-PuppetDesk.ps1','build-info.json','checksums.json','Install or Update Puppet Desk.cmd'}
              exe=z.read('Puppet Desk.exe')
              assert b'for any reason' in exe and b'licensed, not sold' in exe
          assert info.get('application') == 'PuppetDesk'
          assert info.get('channel') == 'Public'
          assert info.get('version') == '1.9.0'
          assert info.get('buildNumber') == '85'
          assert info.get('commit') == '7f33b16c117968acef4e4982017f92dd80abe071'
          print('Verified Puppet Desk v1.9.0 Build 85; package contains no owner server')
          PY
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.9.0 assets/Install-Puppet-Desk.exe assets/PuppetDesk-Windows.zip assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Puppet Desk 1.9.0' --notes-file .github/release-notes-1.9.0.md --latest
