name: Publish Puppet Desk 1.7.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.7.1.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build artifact
        env:
          ARTIFACT_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-adc4-81f6-a2c6-8b20e7cfe5f9/raw?se=2026-11-03T05%3A24%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=3957b466-42fb-5717-a657-79db4be60ca6&skoid=c36a4874-d531-4a8d-99fc-7da0d9143d9c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T23%3A59%3A48Z&ske=2026-11-03T23%3A59%3A48Z&sks=b&skv=2026-02-06&sig=esQqD0F5XzBw3fuPhh9sQxU8NyDAU2sq2oTz6mRbtdA%3D'
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --output public.zip "$ARTIFACT_URL"
          echo '874ec9af8799d5bfe036a7eaa6a7b8d35039cb9e94703f6fa3d5357e255c1162  public.zip' | sha256sum --check
          mkdir assets
          unzip -q public.zip -d assets
          (cd assets && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          from zipfile import ZipFile
          import json
          with ZipFile('assets/PuppetDesk-Windows.zip') as z:
              info=json.loads(z.read('build-info.json').decode('utf-8-sig'))
          assert info.get('application') == 'PuppetDesk'
          assert info.get('channel') == 'Public'
          assert info.get('version') == '1.7.2'
          assert info.get('buildNumber') == '69'
          assert info.get('commit') == '70981f769682922b817f57cef43f7934979ea935'
          print('Verified Puppet Desk v1.7.2 Build 69')
          PY
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.7.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.7.2 assets/Install-Puppet-Desk.exe assets/PuppetDesk-Windows.zip assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.7.2 assets/Install-Puppet-Desk.exe assets/PuppetDesk-Windows.zip assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target main --title 'Puppet Desk 1.7.2' --notes 'Build 69: Keeps hosted guest puppets visible when resized, preserves visual position as transparent capture windows change, and adds Recenter selected puppet beside Guest puppet size in Hosting > Manage Guests. Close Puppet Desk and run your existing Update Puppet Desk shortcut.'
          fi
