name: Publish Puppet Desk 1.10.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.7.1.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify owner licensing server readiness
        run: |
          curl --fail --silent --show-error --max-time 20 -H 'ngrok-skip-browser-warning: 1' -A 'PuppetDesk/ReleaseReadiness' https://mummified-isolating-unsaved.ngrok-free.dev/health > health.json
          python3 - <<'PY'
          import json
          h=json.load(open('health.json'))
          assert h.get('Service') == 'PuppetDeskLicensing' and h.get('Ready') is True, 'Service not ready'
          assert h.get('Version',0) >= 2 and h.get('ActivationCodes') is True and h.get('LiveRevocation') is True, 'Updated licensing server required'
          assert h.get('TermsVersion') == '2026-11-07-2', 'Server update required'
          assert h.get('PublicKeySHA256') == '03c14daf9df4d8b6b5689071b381c23fcc518e7cd6e87bc87d61cf459fe14530', 'Verification key mismatch'
          print('Verified live HTTPS server readiness and public verification key')
          PY
      - name: Download verified build artifact
        env:
          ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-7dc0-81f5-ba32-e55aa80a4520/raw?se=2026-11-07T15%3A30%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=c1c05fb7-6fb5-4363-85b2-8a2d23d1e1cc&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T15%3A07%3A17Z&ske=2026-11-08T15%3A07%3A17Z&sks=b&skv=2026-02-06&sig=EmZv2FNUUxrZqDXrfFbsi%2BsUPbPVzv4PJF9KQWobh9o%3D'
        run: |
          curl --fail --location --retry 2 --retry-delay 2 --max-time 60 --output public.zip "$ARTIFACT_URL"
          echo 'dbfa81de0bbbef20f0cb9b69431e9798b69457a2dbf3be96b8790fa1758823e6  public.zip' | sha256sum --check
          mkdir assets
          unzip -q public.zip -d assets
          (cd assets && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          from zipfile import ZipFile
          import json
          from pathlib import Path
          assert {p.name for p in Path('assets').iterdir()} == {'Install-Puppet-Desk.exe','PuppetDesk-Windows.zip','SHA256SUMS.txt'}
          with ZipFile('assets/PuppetDesk-Windows.zip') as z:
              info=json.loads(z.read('build-info.json').decode('utf-8-sig'))
              assert set(z.namelist()) == {'Puppet Desk.exe','README.txt','Update-PuppetDesk.ps1','build-info.json','checksums.json','Install or Update Puppet Desk.cmd'}
              exe=z.read('Puppet Desk.exe')
              assert b'for any reason' in exe and b'licensed, not sold' in exe
          assert info.get('application') == 'PuppetDesk'
          assert info.get('channel') == 'Public'
          assert info.get('version') == '1.10.0'
          assert info.get('buildNumber') == '91'
          assert info.get('commit') == '5ef33b125ed2e025ddac22ea81940706051156af'
          print('Verified Puppet Desk v1.10.0 Build 91; package contains no owner server')
          PY
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.10.0 assets/Install-Puppet-Desk.exe assets/PuppetDesk-Windows.zip assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Puppet Desk 1.10.0' --notes-file .github/release-notes-1.10.0.md --latest
